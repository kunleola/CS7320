name: Check Markdown links

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore link-check cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir .
            --cache
            --max-cache-age 1d
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            --verbose
            --no-progress
            './**/*.md'
          fail: true
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}
