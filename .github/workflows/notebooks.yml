name: Run notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core Python notebooks
            suite: core
            overlay: ""
          - name: Gymnasium notebook
            suite: gymnasium
            overlay: environments/gymnasium.yml
          - name: LLM notebook
            suite: llm
            overlay: environments/llm.yml
          - name: R notebooks
            suite: r
            overlay: environments/r.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create course environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: CS7320-AI
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true

      - name: Add optional topic environment
        if: matrix.overlay != ''
        shell: bash -el {0}
        run: mamba env update --name CS7320-AI --file "${{ matrix.overlay }}"

      - name: Add the Python/R bridge used by mixed-language notebooks
        if: matrix.suite == 'r'
        shell: bash -el {0}
        run: mamba install --yes --name CS7320-AI rpy2 r-tsp

      - name: Execute notebooks
        if: matrix.suite != 'gymnasium'
        shell: bash -el {0}
        env:
          MPLBACKEND: Agg
        run: python .github/scripts/run_notebooks.py "${{ matrix.suite }}"

      - name: Execute Gymnasium notebook in a virtual display
        if: matrix.suite == 'gymnasium'
        shell: bash -el {0}
        env:
          MPLBACKEND: Agg
        run: xvfb-run --auto-servernum python .github/scripts/run_notebooks.py gymnasium
